[mgr]
ratio = [1,4,4]
sort_by ="natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "mtime"
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"
image_filter = "nearest"
max_width = 3840
max_height = 2160
image_quality = 90

[plugin]

prepend_preloaders = [
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/postscript", run = "mediainfo" },
    # { url = "/run/user/1000/gvfs/**/*", run = "noop" },
    { url = "/run/media/USER_NAME/**/*", run = "noop" },

      # Office Documents
    # { mime = "application/openxmlformats-officedocument.*", run = "office" },
    # { mime = "application/oasis.opendocument.*", run = "office" },
    # { mime = "application/ms-*", run = "office" },
    # { mime = "application/msword", run = "office" },
    # { url = "*.docx", run = "office" },
    # { url = "*.doc", run = "office" },
    # { url = "*.xlsx", run = "office" },
    # { url = "*.xls", run = "office" },
  ]

  prepend_previewers = [
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/postscript", run = "mediainfo" },
    { mime = "image/{jpeg,png,webp}", run = "zoom 5" },
    { url = "*/", run = "folder" },
    # { url = "/run/user/1000/gvfs/**/*", run = "noop" },
    # { url = "/run/media/USER_NAME/**/*", run = "noop" },

    { url = "*.csv", run = "rich-preview"}, # for csv files
    { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
    { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
    { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
    { url = "*.json", run = "rich-preview"}, # for json (.json) files

    { url = "*.md", run = 'piper -- rich -j --left --panel=rounded --guides --line-numbers --force-terminal "$1"' },

    # Office Documents
    # { mime = "application/openxmlformats-officedocument.*", run = "office" },
    # { mime = "application/oasis.opendocument.*", run = "office" },
    # { mime = "application/ms-*", run = "office" },
    # { mime = "application/msword", run = "office" },
    # { url = "*.docx", run = "office" },
  ]

  prepend_fetchers = [
    {id = "git", url = "*", run = "git", group = "git"},
    {id = "git", url = "*/", run = "git", group = "git"},
  ]

[opener]
    edit = [
        { run = "$EDITOR %s", block = true, for = "unix" },
        { run = "%EDITOR% %s", block = true, for = "windows" },
    ]

[tasks]
  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB

